<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font-family: -apple-system, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #phone { width: 390px; background: #000; color: #fff; padding-bottom: 14px; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 14px 26px 0 30px; height: 44px;
            font-weight: 600; font-size: 16px; }
  .icons { display: flex; gap: 6px; align-items: center; }
  .head { position: relative; height: 118px; }
  .back { position: absolute; left: 12px; top: 18px; display: flex; align-items: center; gap: 6px;
          background: #1c1c1e; border-radius: 22px; padding: 7px 12px 7px 8px; }
  .back svg { display: block; }
  .badge { background: #e5e5ea; color: #000; font-size: 14px; font-weight: 700; border-radius: 11px; padding: 2px 9px; }
  .avatar { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(160deg, #f9c87f 0%, #f07aa9 55%, #c84fd6 100%); display: flex;
            align-items: center; justify-content: center; font-size: 36px; font-weight: 700; }
  .title { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); background: #1c1c1e; border-radius: 18px;
           padding: 6px 14px; font-size: 16px; font-weight: 700; white-space: nowrap; }
  .title span { color: #8e8e93; font-weight: 600; margin-left: 4px; }
  .msgs { padding: 6px 12px 0 12px; display: flex; flex-direction: column; gap: 10px; }
  .in, .out { max-width: 80%; border-radius: 19px; padding: 9px 14px; font-size: 16px; line-height: 21px; white-space: pre-wrap; }
  .in { background: #262629; align-self: flex-start; border-bottom-left-radius: 6px; }
  .out { background: #1f8a3c; align-self: flex-end; border-bottom-right-radius: 6px; font-weight: 500; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 16px 12px 0 12px; }
  .plus { width: 34px; height: 34px; border-radius: 50%; background: #1c1c1e; display: flex; align-items: center;
          justify-content: center; font-size: 24px; color: #d1d1d6; }
  .field { flex: 1; border: 1px solid #3a3a3c; border-radius: 18px; padding: 7px 14px; color: #636366; font-size: 16px; }
</style></head>
<body><div id="phone">
  <div class="status"><div>9:41</div>
    <div class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.6a3.2 3.2 0 0 0-4.4 0z" fill="#fff"/><path d="M3.6 6.9a6.3 6.3 0 0 1 8.8 0l-1.4 1.7a4.2 4.2 0 0 0-6 0z" fill="#fff"/><path d="M1.2 4.1a9.6 9.6 0 0 1 13.6 0l-1.4 1.7a7.4 7.4 0 0 0-10.8 0z" fill="#fff"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#8e8e93" fill="none"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#fff"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#8e8e93"/></svg>
    </div></div>
  <div class="head">
    <div class="back"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge">3</span></div>
    <div class="avatar">E</div>
    <div class="title">Email Agent<span>&rsaquo;</span></div>
  </div>
  <div class="msgs">
    <div class="in">{{DRAFT}}</div>
    <div class="out">{{REPLY}}</div>
    <div class="in">{{SENT}}</div>
  </div>
  <div class="bar"><div class="plus">+</div><div class="field">Text Message &middot; SMS</div></div>
</div></body></html>

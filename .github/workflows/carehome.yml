# Care-home cold email campaign, running in GitHub's cloud so Joey's PC can be off (9/29).
# State (carehome.db, queue.json, logs...) lives on the `state` branch as a single commit that every run replaces.
name: carehome

on:
  schedule:
    - cron: "3-59/10 11-19 * * *"    # send windows: 7-10 AM local for ET through PT/AK homes (UTC), every 10 min
    - cron: "7 0-10,20-23 * * *"      # rest of the day: hourly reply/bounce check + reply texts to Joey
    - cron: "20 1 * * *"              # nightly stats to Notion (9:20 PM ET)
    - cron: "40 5 * * *"              # nightly day 7 prep: Ad Library check + photo pick (1:40 AM ET), Joey 10/24
  # 9/29: GitHub's timer never fired on this new repo, so a Claude cloud routine also pushes an empty commit to
  # claude/tick every hour as a backup clock. Extra runs are harmless: daily caps and one-send-per-step hold.
  push:
    branches: ["claude/tick"]
  workflow_dispatch:
    inputs:
      task:
        description: "run | dry | stats | status | seed | day7 | photo-check | port-check"
        default: run
      to:
        description: "seed only: test inboxes, space separated"
        default: ""

concurrency:
  group: carehome
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  carehome:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/New_York
      CAREHOME_CLOUD: "1"
      CAREHOME_SECRETS: ${{ secrets.CAREHOME_SECRETS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # tick pushes carry no code; always run the latest engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 10/24: day 7 makes each home's picture (free ad or phone screen) in a headless browser.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/surven-clip
          key: playwright-clip-${{ runner.os }}-1.64.1
      - run: python -m playwright install --with-deps chromium
      - name: Write .env
        run: printf '%s\n' "$DOTENV" > .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
      - name: Point at the private state repo
        # 10/10: this repo is public (free Actions minutes); the lead db, queue and logs live in the private
        # joedubstep/surven-carehome-state, reached with a write deploy key that only opens that one repo.
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add state git@github.com:joedubstep/surven-carehome-state.git
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
      - name: Pull state
        run: python tools/cloud_state.py pull
      - name: Pick task
        id: pick
        run: |
          T="${{ github.event.inputs.task }}"
          if [ -z "$T" ]; then
            if [ "${{ github.event.schedule }}" = "20 1 * * *" ]; then T=stats; else T=run; fi
            if [ "${{ github.event.schedule }}" = "40 5 * * *" ]; then T=day7; fi
            if [ "${{ github.event_name }}" = "push" ] && [ "$(date +%H)" = "21" ]; then T=stats; fi
          fi
          echo "task=$T" >> "$GITHUB_OUTPUT"
      - name: Campaign run
        if: steps.pick.outputs.task == 'run' || steps.pick.outputs.task == 'stats'  # stats nights also scan replies
        run: python -m surven_outreach.carehome run 2>&1 | tee -a data/carehome/task.log
      - name: Dry run (sends nothing)
        if: steps.pick.outputs.task == 'dry'
        run: CAREHOME_IGNORE_TIMING=1 python -m surven_outreach.carehome run --dry
      - name: Day 7 prep (Ad Library check + photo pick for homes due by tomorrow)
        if: steps.pick.outputs.task == 'day7'
        run: python -m surven_outreach.carehome day7-prep 2>&1 | tee -a data/carehome/task.log
      - name: Mail port check (can this machine reach mail servers on port 25?)
        if: steps.pick.outputs.task == 'port-check'
        run: |
          python - <<'EOF'
          import socket
          for h in ["gmail-smtp-in.l.google.com", "mx1.improvmx.com", "mail.protection.outlook.com"]:
              try:
                  s = socket.create_connection((h, 25), timeout=10); print(h, "OPEN", s.recv(80)[:40]); s.close()
              except Exception as e:
                  print(h, "blocked", type(e).__name__)
          EOF
      - name: Day 7 photo check (10 homes, counts only, saves nothing)
        if: steps.pick.outputs.task == 'photo-check'
        run: python -m surven_outreach.carehome day7-photo-check
      - name: Nightly stats
        if: steps.pick.outputs.task == 'stats'
        run: python -m surven_outreach.carehome_stats 2>&1 | tee -a data/carehome/stats_task.log
      - name: Inbox placement test (sends to test inboxes only)
        if: steps.pick.outputs.task == 'seed'
        run: python tools/seed_test.py ${{ github.event.inputs.to }}
      - name: Status
        if: steps.pick.outputs.task == 'status'
        run: python -m surven_outreach.carehome status | tail -n 40
      - name: Save state
        if: always() && steps.pick.outputs.task != 'dry' && steps.pick.outputs.task != 'seed' && steps.pick.outputs.task != 'photo-check' && steps.pick.outputs.task != 'port-check'
        run: python tools/cloud_state.py save-cloud
